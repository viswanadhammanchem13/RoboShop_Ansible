- name: Configuring Shipping Component
  hosts: shipping
  become: yes
  tasks:
  - name: Installing maven
    ansible.builtin.dnf:
      name: "{{ item }}"
      state: present
    loop:
    - maven
    - mysql

  - name: install PyMySQL and cryptography 
    ansible.builtin.pip:
      name: "{{ item }}"
      executable: pip3.9
    loop:
    - cryptography
    - PyMySQL

  - name: Creating System user
    ansible.builtin.user:
      name: roboshop
      home: /app
      shell: /sbin/nologin
      system: true

  - name: Creating /app directory
    ansible.builtin.file:
      path: /app
      state: directory
  - name: Downloading the code
    ansible.builtin.get_url:
      url: https://roboshop-artifacts.s3.amazonaws.com/shipping-v3.zip 
      dest: /tmp/shipping.zip

  - name: Extracting the code
    ansible.builtin.unarchive:
      src: /tmp/shipping.zip
      dest: /app
      remote_src: yes

  - name: Installing Maven dependencies
    ansible.builtin.command: mvn clean package
    args:
      chdir: /app

  - name: Renaming Jar  file 
    ansible.builtin.command: mv target/shipping-1.0.jar shipping.jar
    args:
      chdir: /app
  
  - name: Copying Shipping service
    ansible.builtin.copy:
      src: shipping.service
      dest: /etc/systemd/system/shipping.service

  - name: System Daemon Reloading
    ansible.builtin.systemd_service:
      daemon_reload: true

  - name: Start and Enabling service
    ansible.builtin.service:
      name: shipping 
      state: started
      enabled: yes

  - name: Installing MySQL Client
    ansible.builtin.dnf:
      name: mysql
      state: present

  - name: import data
    # tags:
    # - import
    community.mysql.mysql_db:
      name: all
      login_user: root
      login_password: RoboShop@1
      login_host: mysql.manchem.site
      state: import
      target: "{{ item }}"
    loop:
    - /app/db/schema.sql
    - /app/db/app-user.sql
    - /app/db/master-data.sql

  - name: restart shipping
    tags:
    - import
    ansible.builtin.service:
      state: restarted
      name: shipping